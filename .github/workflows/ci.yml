name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ansible:
    name: yaml + ansible-lint + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install --upgrade "ansible-core>=2.16" ansible-lint yamllint

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint -c .yamllint ansible/ .yamllint .pre-commit-config.yaml .github/

      - name: ansible-lint
        run: ansible-lint

      - name: Playbook syntax check
        working-directory: ansible
        run: |
          ansible-playbook -i inventory/hosts.ini playbooks/linux.yml        --syntax-check
          ansible-playbook                        playbooks/public-linux.yml --syntax-check
          ansible-playbook                        playbooks/mac.yml          --syntax-check

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -S warning install.sh bootstrap-mac.sh bootstrap-public-linux.sh bootstrap_pi.sh

  stylua:
    name: stylua (nvim lua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check --config-path .config/nvim/stylua.toml .config/nvim
