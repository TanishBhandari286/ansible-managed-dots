# ~/.config/starship.toml

command_timeout = 2000

# Detached solid-color powerline format
format = """
$os\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$kubernetes\
\n$character"""

# Tokyo Night (Storm) palette
palette = 'tokyonight'

[palettes.tokyonight]
base = '#24283b'
overlay = '#292e42'
text = '#c0caf5'
red = '#f7768e'
yellow = '#e0af68'
magenta = '#bb9af7'
blue = '#7aa2f7'
cyan = '#7dcfff'
purple = '#9d7cd8'

[os]
disabled = false
format = "[  ](bg:blue fg:base)[](fg:blue) "

[hostname]
ssh_only = true
format = "[ 󰒋 $hostname ](bg:red fg:base)[](fg:red) "

[directory]
format = "[  $path ](bg:overlay fg:text)[](fg:overlay) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[  $branch ](bg:magenta fg:base)[](fg:magenta) "

[git_status]
format = "[$all_status$ahead_behind ](fg:red)"

[nodejs]
format = "[  $version ](bg:yellow fg:base)[](fg:yellow) "

[kubernetes]
disabled = false
format = "[ 󱃾 $context ](bg:cyan fg:base)[](fg:cyan) "

[python]
format = "[  $version ](bg:purple fg:base)[](fg:purple) "
pyenv_version_name = false
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version"]

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
