# ── tmux.conf ──────────────────────────────────────────────────────────

# Mouse mode: scroll wheel/trackpad enters copy-mode and scrolls the pane,
# click to select a pane, drag to resize. Without this, scrolling does
# nothing (or leaks escape sequences to whatever's running in the pane).
set -g mouse on

# Default is 2000 lines -- too short to scroll back through a real log
# or build output.
set -g history-limit 50000

# vi-style movement/search inside copy-mode (matches nvim muscle memory).
setw -g mode-keys vi

# `y` (and mouse-drag release) copies to the system clipboard, not just
# tmux's own paste buffer -- otherwise the text can't be pasted into
# other apps. pbcopy is macOS-only, hence the guard (Linux boxes share
# this file and just skip it).
if-shell "command -v pbcopy > /dev/null 2>&1" "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy"
if-shell "command -v pbcopy > /dev/null 2>&1" "bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel pbcopy"
if-shell "command -v pbcopy > /dev/null 2>&1" "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy"

# ── Statusline ──────────────────────────────────────────────────────────
# Tokyo Night Storm, matching the LazyVim lualine "auto" theme (tokyonight)
# and the Ghostty "TokyoNight Storm" builtin palette 1:1.
#
#   lualine a  (mode)   -> session name: blue bg / black text, bold
#                          (flips to yellow, command-mode, while prefix held)
#   lualine b  (branch) -> git branch (hostname fallback): gutter bg / blue fg
#   bufferline          -> window list: active = bg_highlight/blue, idle = comment
#   lualine z  (clock)  -> %H:%M on the right

# --- palette (tokyonight storm / ghostty tokyonight_storm) ---
set -g @tn-bg      "#24283b"  # terminal / pane background
set -g @tn-bg-dark "#1f2335"  # statusline background (lualine bg_statusline)
set -g @tn-bg-hi   "#292e42"  # bg_highlight
set -g @tn-gutter  "#3b4261"  # fg_gutter
set -g @tn-fg      "#c0caf5"
set -g @tn-fg-dim  "#a9b1d6"  # fg_dark / fg_sidebar
set -g @tn-comment "#565f89"
set -g @tn-black   "#1d202f"
set -g @tn-blue    "#7aa2f7"
set -g @tn-yellow  "#e0af68"
set -g @tn-cyan    "#7dcfff"

# --- base status bar ---
set -g status on
set -g status-style "bg=#{@tn-bg-dark},fg=#{@tn-fg-dim}"
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 60

# --- left: session name (lualine "a" mode segment) + branch (lualine "b") ---
set -g status-left \
  "#[bg=#{?client_prefix,#{@tn-yellow},#{@tn-blue}},fg=#{@tn-black},bold]  #S  #[bg=#{@tn-gutter},fg=#{@tn-blue}]   #(git -C \"#{pane_current_path}\" rev-parse --abbrev-ref HEAD 2>/dev/null || hostname -s)  "

# --- windows (bufferline analogue) ---
setw -g window-status-separator " "
setw -g window-status-format           "#[bg=#{@tn-bg-dark},fg=#{@tn-comment}] #I:#W#F "
setw -g window-status-current-format   "#[bg=#{@tn-bg-hi},fg=#{@tn-blue},bold] #I:#W#F "
# last-window / activity get plain style options (the -format variants don't exist)
setw -g window-status-last-style      "bg=#{@tn-bg-dark},fg=#{@tn-blue}"
setw -g window-status-activity-style  "bg=#{@tn-bg-dark},fg=#{@tn-cyan}"

# --- right: clock (lualine "z") ---
set -g status-right \
  "#[bg=#{@tn-gutter},fg=#{@tn-blue}]   %H:%M  "

# Messages/prompt render inside the status bar -- keep them on-palette too.
set -g message-style "bg=#{@tn-bg-hi},fg=#{@tn-fg}"
set -g message-command-style "bg=#{@tn-bg-hi},fg=#{@tn-yellow}"
