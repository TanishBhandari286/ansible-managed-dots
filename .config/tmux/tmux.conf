# ── tmux.conf ──────────────────────────────────────────────────────────

# Mouse mode: scroll wheel/trackpad enters copy-mode and scrolls the pane,
# click to select a pane, drag to resize. Without this, scrolling does
# nothing (or leaks escape sequences to whatever's running in the pane).
set -g mouse on

# Default is 2000 lines -- too short to scroll back through a real log
# or build output.
set -g history-limit 50000

# vi-style movement/search inside copy-mode (matches nvim muscle memory).
setw -g mode-keys vi

# ── Terminal / behaviour ───────────────────────────────────────────────
# Truecolor: without this, nvim's Tokyo Night palette degrades to 256-color
# inside tmux. `default-terminal` advertises 256-color + italics to apps;
# the RGB override tells tmux the *outer* terminal (Ghostty) is 24-bit.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# nvim's :checkhealth flags a laggy Esc without this — the default 500ms
# delay makes Esc-heavy modal editing feel sticky.
set -sg escape-time 0

# Let nvim know when the terminal gains/loses focus (autoread, cursor shape).
set -g focus-events on

# Renumber windows when one closes so the list has no gaps.
set -g renumber-windows on

# Start numbering at 1 — 0 is a long reach from the number-row home position.
set -g base-index 1
setw -g pane-base-index 1

# `y` (and mouse-drag release) copies to the system clipboard, not just
# tmux's own paste buffer -- otherwise the text can't be pasted into
# other apps.
#
# This used to pipe the selection through `pbcopy`, which only exists in
# the macOS shell tmux itself is running in. That's exactly backwards for
# this fleet: every one of vps/master-node/dp-2/dp is a *remote* tmux
# session reached over SSH from Ghostty — there is no pbcopy over there,
# so the `command -v pbcopy` guard silently skipped the bind and copy did
# nothing. (Locally it mostly worked, which is why this looked like a
# "sometimes" bug instead of an always bug.)
#
# `set-clipboard on` makes tmux emit an OSC 52 escape sequence instead of
# shelling out to a clipboard binary. OSC 52 is interpreted by the
# *outermost* terminal — Ghostty, which already has `clipboard-write =
# allow` — so it writes to the real macOS pasteboard whether tmux is
# local or three SSH hops away. No clipboard tool needs to exist on the
# remote box at all.
set -s set-clipboard on
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ── Statusline ──────────────────────────────────────────────────────────
# Tokyo Night Storm, matching the LazyVim lualine "auto" theme (tokyonight)
# and the Ghostty "TokyoNight Storm" builtin palette 1:1.
#
#   lualine a  (mode)   -> session name: blue bg / black text, bold
#                          (flips to yellow, command-mode, while prefix held)
#   lualine b  (branch) -> git branch (hostname fallback): gutter bg / blue fg
#   bufferline          -> window list: active = bg_highlight/blue, idle = comment
#   lualine z  (clock)  -> %H:%M on the right

# --- palette (tokyonight storm / ghostty tokyonight_storm) ---
set -g @tn-bg      "#24283b"  # terminal / pane background
set -g @tn-bg-dark "#1f2335"  # statusline background (lualine bg_statusline)
set -g @tn-bg-hi   "#292e42"  # bg_highlight
set -g @tn-gutter  "#3b4261"  # fg_gutter
set -g @tn-fg      "#c0caf5"
set -g @tn-fg-dim  "#a9b1d6"  # fg_dark / fg_sidebar
set -g @tn-comment "#565f89"
set -g @tn-black   "#1d202f"
set -g @tn-blue    "#7aa2f7"
set -g @tn-yellow  "#e0af68"
set -g @tn-cyan    "#7dcfff"

# --- base status bar ---
set -g status on
set -g status-style "bg=#{@tn-bg-dark},fg=#{@tn-fg-dim}"
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 60

# --- left: session name (lualine "a" mode segment) + branch (lualine "b") ---
set -g status-left \
  "#[bg=#{?client_prefix,#{@tn-yellow},#{@tn-blue}},fg=#{@tn-black},bold]  #S  #[bg=#{@tn-gutter},fg=#{@tn-blue}]   #(git -C \"#{pane_current_path}\" rev-parse --abbrev-ref HEAD 2>/dev/null || hostname -s)  "

# --- windows (bufferline analogue) ---
setw -g window-status-separator " "
setw -g window-status-format           "#[bg=#{@tn-bg-dark},fg=#{@tn-comment}] #I:#W#F "
setw -g window-status-current-format   "#[bg=#{@tn-bg-hi},fg=#{@tn-blue},bold] #I:#W#F "
# last-window / activity get plain style options (the -format variants don't exist)
setw -g window-status-last-style      "bg=#{@tn-bg-dark},fg=#{@tn-blue}"
setw -g window-status-activity-style  "bg=#{@tn-bg-dark},fg=#{@tn-cyan}"

# --- right: clock (lualine "z") ---
set -g status-right \
  "#[bg=#{@tn-gutter},fg=#{@tn-blue}]   %H:%M  "

# Messages/prompt render inside the status bar -- keep them on-palette too.
set -g message-style "bg=#{@tn-bg-hi},fg=#{@tn-fg}"
set -g message-command-style "bg=#{@tn-bg-hi},fg=#{@tn-yellow}"

# ── vim-tmux-navigator ─────────────────────────────────────────────────
# <C-h/j/k/l> moves between tmux panes AND nvim splits seamlessly. Pairs
# with .config/nvim/lua/plugins/tmux-navigator.lua. When the focused pane
# is running nvim (or fzf), the keystroke is forwarded; otherwise tmux
# switches panes itself.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
# <C-l> is now pane-right, so reach "clear screen" via <prefix> C-l.
bind C-l send-keys 'C-l'
