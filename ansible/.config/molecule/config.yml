---
# Shared Molecule base config — merged into every scenario's molecule.yml
# when `molecule` is run from the `ansible/` directory.
#
# Status: SCAFFOLDING. The Debian roles assume Homebrew-on-Linux and (for
# docker) a working systemd, so a from-scratch `molecule converge` in a
# plain container is slow and flaky today. Wire these into CI only after
# the tier-2 role refactor decouples the linuxbrew assumption, or after
# switching to pre-baked images. See ansible/TESTING.md.

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: docker

platforms:
  - name: dots-ubuntu-2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /usr/lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks
  inventory:
    group_vars:
      all:
        target_user: root
        user_home: /root

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
