---
# mac.yml — Provision macOS workstation (Ansible + Homebrew).
# Replaces the old nix-darwin + home-manager setup. Nix is gone; Homebrew
# (via `brew bundle` on .config/Brewfile) is the single source of truth for
# packages, casks, taps, VSCode extensions, go and npm globals.

- name: Provision macOS workstation
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    dots_dir: "{{ ansible_facts['env']['HOME'] }}/dots"
    brewfile: "{{ dots_dir }}/.config/Brewfile"
    mac_defaults:
      # Dock
      - { domain: com.apple.dock, key: autohide, type: bool, value: "true" }
      - { domain: com.apple.dock, key: mru-spaces, type: bool, value: "false" }
      - { domain: com.apple.dock, key: orientation, type: string, value: "bottom" }
      # Finder
      - { domain: com.apple.finder, key: AppleShowAllExtensions, type: bool, value: "true" }
      - { domain: com.apple.finder, key: FXPreferredViewStyle, type: string, value: "Nlsv" }
      - { domain: com.apple.finder, key: ShowPathbar, type: bool, value: "true" }
      - { domain: com.apple.finder, key: ShowStatusBar, type: bool, value: "true" }
      # Keyboard
      - { domain: NSGlobalDomain, key: AppleKeyboardUIMode, type: int, value: "3" }
      - { domain: NSGlobalDomain, key: KeyRepeat, type: int, value: "2" }
      - { domain: NSGlobalDomain, key: InitialKeyRepeat, type: int, value: "15" }
      # Screenshots
      - { domain: com.apple.screencapture, key: location, type: string, value: "~/Pictures/Screenshots" }

  pre_tasks:
    - name: Verify we are running on macOS
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Darwin'
        fail_msg: "This playbook targets macOS only."

  tasks:
    - name: Ensure Homebrew is installed
      ansible.builtin.shell: |
        command -v brew >/dev/null 2>&1 || \
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install all bundles (brews, casks, taps, vscode)
      ansible.builtin.command:
        cmd: brew bundle --file={{ brewfile }}
      environment:
        PATH: "/opt/homebrew/bin:/opt/homebrew/opt/python@3.14/bin:{{ ansible_facts['env']['PATH'] }}"
        # Non-interactive run: no TTY for sudo. Skip the obs cask upgrade —
        # its uninstall stanza sudo-deletes the root-owned virtualcam plugin
        # and would abort the whole bundle. Upgrade obs manually in a terminal.
        HOMEBREW_BUNDLE_CASK_SKIP: "obs"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        HOMEBREW_NO_ENV_HINTS: "1"

    - name: Install runtimes via mise (node, go)
      ansible.builtin.shell: |
        set -euo pipefail
        mise use -g node@22
        mise use -g go@latest
      environment:
        PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
      changed_when: false

    - name: Install go tools (gopls)
      ansible.builtin.shell: |
        set -euo pipefail
        eval "$(mise activate bash)"
        go install golang.org/x/tools/gopls@latest
      environment:
        PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
      changed_when: false

    - name: Install npm globals via mise node
      ansible.builtin.shell: |
        set -euo pipefail
        eval "$(mise activate bash)"
        npm install -g eslint@latest tree-sitter-cli@latest
      environment:
        PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
      changed_when: false

    - name: Apply macOS system defaults
      community.general.osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        type: "{{ item.type }}"
        value: "{{ item.value }}"
      loop: "{{ mac_defaults }}"

    - name: Restart Dock and Finder so defaults take effect
      ansible.builtin.shell: |
        killall Dock 2>/dev/null || true
        killall Finder 2>/dev/null || true
        killall SystemUIServer 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Decrypt SSH keys from Ansible Vault
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p "$HOME/.ssh"
        for vault_file in {{ dots_dir }}/ssh_keys/id_*; do
          # Skip .pub (plaintext) and .enc (removed sops legacy) files
          case "$vault_file" in
            *.pub|*.enc) continue ;;
          esac
          [ -f "$vault_file" ] || continue
          name="$(basename "$vault_file")"
          target="$HOME/.ssh/$name"
          if [ ! -f "$target" ]; then
            ansible-vault view "$vault_file" > "$target"
            chmod 600 "$target"
            echo "Decrypted: $name"
          fi
        done
      args:
        executable: /bin/bash
      environment:
        PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
        ANSIBLE_VAULT_PASSWORD_FILE: "{{ dots_dir }}/ansible/.vault_pass"
      changed_when: false

    - name: Symlink dotfiles via install.sh
      ansible.builtin.command:
        cmd: ./install.sh
        chdir: "{{ dots_dir }}"
      changed_when: false
