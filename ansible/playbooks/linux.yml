---

- name: Provision Linux servers / VPS
  hosts: linux
  gather_facts: true

  pre_tasks:
    - name: Verify we are running on Linux
      ansible.builtin.assert:
        that: ansible_facts['os_family'] in ["Debian", "RedHat", "Archlinux"]
        fail_msg: "This playbook targets Debian/Ubuntu or RHEL-based Linux systems."

    - name: Update apt cache (Debian/Ubuntu only)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"
      become: true

    - name: Set user_home and target_user
      # ansible_facts['user_id'] (not ansible_user) so this fact resolves the
      # same way here and in public-linux.yml's localhost/connection:local run.
      ansible.builtin.set_fact:
        user_home: "/home/{{ ansible_facts['user_id'] }}"
        target_user: "{{ ansible_facts['user_id'] }}"

  roles:
    - { role: packages,  become: true,  tags: [packages, apt] }
    - { role: shell,           become: true,  tags: [shell, zsh] }
    - { role: node,      become: true,  tags: [node, mise, runtimes] }
    - { role: docker,    become: true,  tags: [docker, containers] }

    - { role: ssh,       become: false, tags: [ssh, keys] }

    - { role: dotfiles,        become: false, tags: [dotfiles, symlinks, config] }
