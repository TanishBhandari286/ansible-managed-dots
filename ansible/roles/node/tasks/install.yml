---
# install.yml — Install Node.js 22 via mise (polyglot runtime manager).
# Replaces nvm + brew node@22. mise is already installed by the packages role.

- name: Ensure mise is installed
  ansible.builtin.command: mise --version
  register: mise_check
  failed_when: false
  changed_when: false

- name: Install Node.js 22 LTS via mise
  ansible.builtin.shell: |
    set -euo pipefail
    mise use -g node@22
  environment:
    HOME: "{{ user_home }}"
    PATH: "{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  become: false
  when: mise_check.rc == 0

- name: Install/update command-code (coding agent) via npm
  ansible.builtin.shell: |
    set -euo pipefail
    eval "$(mise activate bash)"
    npm install -g command-code@latest
  environment:
    HOME: "{{ user_home }}"
    PATH: "{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  become: false
  when: mise_check.rc == 0
  tags: [command-code]
