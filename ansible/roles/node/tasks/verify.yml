---
# verify.yml — Verify Node.js installed via mise.

- name: Get node version via mise
  ansible.builtin.shell: |
    set -euo pipefail
    eval "$(mise activate bash)"
    node --version
  register: node_version
  changed_when: false
  environment:
    HOME: "{{ user_home }}"
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  become: false

- name: Get npm version via mise
  ansible.builtin.shell: |
    set -euo pipefail
    eval "$(mise activate bash)"
    npm --version
  register: npm_version
  changed_when: false
  environment:
    HOME: "{{ user_home }}"
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ user_home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  become: false

- name: Verify node is 22.x
  ansible.builtin.assert:
    that: node_version.stdout is match('^v22\.')
    fail_msg: >
      Expected Node.js 22.x but got {{ node_version.stdout }}.
    success_msg: "Node.js {{ node_version.stdout }} — OK"

- name: Print Node.js and npm versions
  ansible.builtin.debug:
    msg:
      - "node : {{ node_version.stdout }}"
      - "npm  : v{{ npm_version.stdout }}"
