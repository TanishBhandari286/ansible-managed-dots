---
# shell role — Set Zsh as default shell.
# zsh itself is now installed by Homebrew; this role only registers it.

- name: "[Linux] Ensure Homebrew Zsh is in /etc/shells"
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: /home/linuxbrew/.linuxbrew/bin/zsh
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags: [zsh_install]

- name: "[Linux] Set Zsh as default shell for current user"
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: /home/linuxbrew/.linuxbrew/bin/zsh
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags: [zsh_install]
