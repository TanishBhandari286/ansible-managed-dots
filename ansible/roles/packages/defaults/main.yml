---

# ---- Brew packages (replaces apt + GitHub releases + git clones) ------------
brew_packages:
  # Base tools
  - zsh
  - git
  - curl
  - wget
  - unzip
  - tmux
  - htop
  - tree
  # Modern replacements
  - neovim
  - eza
  - ripgrep
  - fd
  - bat
  - lazydocker
  # Shell tooling
  - starship
  - zoxide
  - mise
  - fzf
  - zsh-syntax-highlighting
  - zsh-autosuggestions
  - zsh-completions
  - lazygit
  - git-delta
  # Runtimes — mise manages node
  - python@3.14


# ---- Old manually-installed binaries to remove from /usr/local/bin ----------
brew_cleanup_binaries:
  - /usr/local/bin/eza
  - /usr/local/bin/rg
  - /usr/local/bin/fd
  - /usr/local/bin/bat
  - /usr/local/bin/fzf
  - /usr/local/bin/starship

# ---- Old git-clone directories to purge -------------------------------------
brew_cleanup_dirs:
  - "{{ user_home }}/.fzf"
  - /usr/local/share/zsh-syntax-highlighting
  - /usr/local/share/zsh-autosuggestions
