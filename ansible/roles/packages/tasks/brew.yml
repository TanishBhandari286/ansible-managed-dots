---
# brew.yml — Install Homebrew on Linux, migrate packages from apt to brew,
#            and clean up old apt packages, GitHub-release binaries, and git clones.
#
# IMPORTANT: Homebrew on Linux MUST NOT run as root. All brew tasks use
# become: false. Cleanup tasks (apt, file removal) use become: true.

- name: Check if Homebrew is already installed
  ansible.builtin.command: brew --prefix
  register: brew_check
  failed_when: false
  changed_when: false
  become: false
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  tags: [brew, brew_install, always]

- name: Install Homebrew (Linux — must NOT run as root)
  ansible.builtin.shell: |
    set -euo pipefail
    NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    executable: /bin/bash
  become: false
  when: brew_check.rc != 0
  tags: [brew, brew_install]

- name: Get Homebrew prefix (post-install)
  ansible.builtin.command: brew --prefix
  register: brew_check
  failed_when: false
  changed_when: false
  become: false
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  tags: [brew, brew_install, always]

- name: Set brew_prefix fact
  ansible.builtin.set_fact:
    brew_prefix: "{{ brew_check.stdout }}"
  when: brew_check.rc == 0
  tags: [brew, always]

- name: Install brew packages
  community.general.homebrew:
    name: "{{ brew_packages }}"
    state: present
    update_homebrew: true
    path: /home/linuxbrew/.linuxbrew
  become: false
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_facts['env']['PATH'] }}"
  when: brew_check.rc == 0
  tags: [brew, brew_packages]

- name: Install build-essential (apt — no brew equivalent)
  ansible.builtin.apt:
    name: build-essential
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [brew, apt_essentials]


- name: Remove old manually-installed binaries from /usr/local/bin
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ brew_cleanup_binaries }}"
  become: true
  when: brew_check.rc == 0
  tags: [brew, brew_cleanup]

- name: Remove old git-clone plugin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ brew_cleanup_dirs }}"
  become: true
  when: brew_check.rc == 0
  tags: [brew, brew_cleanup]

- name: Purge leftover /usr/local/share/zsh directories
  ansible.builtin.file:
    path: /usr/local/share/zsh
    state: absent
  become: true
  when: brew_check.rc == 0
  tags: [brew, brew_cleanup]

- name: Remove deadsnakes PPA from apt sources
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/deadsnakes-ppa.sources
    state: absent
  become: true
  when: brew_check.rc == 0
  tags: [brew, brew_cleanup]

- name: Remove deadsnakes GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/deadsnakes.asc
    state: absent
  become: true
  when: brew_check.rc == 0
  tags: [brew, brew_cleanup]
