- name: Check if bat is already installed and get version
  ansible.builtin.command: bat --version
  register: bat_current_version
  failed_when: false
  changed_when: false
  tags: [bat]

- name: Get latest bat release tag from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/sharkdp/bat/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github+json"
  register: bat_release
  tags: [bat]

- name: Set bat version fact
  ansible.builtin.set_fact:
    bat_version: "{{ bat_release.json.tag_name | regex_replace('^v', '') }}"
  tags: [bat]

- name: Download and install latest bat
  ansible.builtin.shell: |
    set -euo pipefail
