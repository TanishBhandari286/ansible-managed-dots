    curl -fsSL "https://github.com/sharkdp/bat/releases/download/${tag}/${asset}.tar.gz" -o /tmp/bat.tar.gz
    rm -rf /tmp/bat-extract && mkdir -p /tmp/bat-extract
    tar -xzf /tmp/bat.tar.gz -C /tmp/bat-extract --strip-components=1
    install -m 0755 /tmp/bat-extract/bat /usr/local/bin/bat
