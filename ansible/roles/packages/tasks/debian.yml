- name: Clone/update fzf to latest and run its installer
  ansible.builtin.shell: |
    set -euo pipefail
    if [ -d "{{ user_home }}/.fzf" ]; then
      git -C "{{ user_home }}/.fzf" pull --ff-only
    else
      git clone https://github.com/junegunn/fzf.git "{{ user_home }}/.fzf"
    fi
    "{{ user_home }}/.fzf/install" --completion --key-bindings --no-update-rc
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ user_home }}"
  become: false
  tags: [fzf]

- name: Symlink fzf binary onto PATH
  ansible.builtin.file:
    src: "{{ user_home }}/.fzf/bin/fzf"
    dest: /usr/local/bin/fzf
    state: link
    force: true
  become: true
  tags: [fzf]

- name: Ensure zsh-syntax-highlighting is present at latest
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: /usr/local/share/zsh-syntax-highlighting
    version: master
    update: true
    force: true
  become: true
  tags: [zsh_plugins]

- name: Ensure zsh-autosuggestions is present at latest
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: /usr/local/share/zsh-autosuggestions
    version: master
    update: true
    force: true
  become: true
  tags: [zsh_plugins]

- name: Check if mise is already installed
  ansible.builtin.command: "{{ user_home }}/.local/bin/mise --version"
  register: mise_check
  failed_when: false
  changed_when: false
  tags: [mise]

- name: Install mise via official installer
  ansible.builtin.shell: |
    curl -fsSL https://mise.run | sh
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ user_home }}"
  become: false
  when: mise_check.rc != 0
  tags: [mise]

- name: Check if omp is already installed and get version
  ansible.builtin.command: omp --version
  register: omp_current_version
  failed_when: false
  changed_when: false
  tags: [omp]

- name: Get latest omp (oh-my-pi) release tag from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/can1357/oh-my-pi/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github+json"
  register: omp_release
  tags: [omp]

- name: Set omp version fact
  ansible.builtin.set_fact:
    omp_version: "{{ omp_release.json.tag_name | regex_replace('^v', '') }}"
  tags: [omp]

- name: Download and install latest omp (coding agent)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL "https://github.com/can1357/oh-my-pi/releases/download/{{ omp_release.json.tag_name }}/omp-linux-{{ omp_arch }}" -o /usr/local/bin/omp
    chmod 0755 /usr/local/bin/omp
  args:
    executable: /bin/bash
  become: true
  when: omp_current_version.rc != 0 or omp_version not in omp_current_version.stdout
  tags: [omp]

