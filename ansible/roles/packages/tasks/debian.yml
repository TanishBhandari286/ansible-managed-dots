---
# debian.yml — Tasks that still need direct downloads (not in brew).
# Python 3.14 now handled by brew (python@3.14); deadsnakes PPA removed.
# Only OMP remains here — not in homebrew-core.

# ---- OMP (oh-my-pi) — not in homebrew-core, still GitHub release ----------

- name: Set architecture-specific download suffixes
  ansible.builtin.set_fact:
    omp_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x64' }}"

- name: Check if omp is already installed and get version
  ansible.builtin.command: omp --version
  register: omp_current_version
  failed_when: false
  changed_when: false
  tags: [omp]

- name: Get latest omp (oh-my-pi) release tag from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/can1357/oh-my-pi/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github+json"
  register: omp_release
  tags: [omp]

- name: Set omp version fact
  ansible.builtin.set_fact:
    omp_version: "{{ omp_release.json.tag_name | regex_replace('^v', '') }}"
  tags: [omp]

- name: Download and install latest omp (coding agent)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL "https://github.com/can1357/oh-my-pi/releases/download/{{ omp_release.json.tag_name }}/omp-linux-{{ omp_arch }}" -o /usr/local/bin/omp
    chmod 0755 /usr/local/bin/omp
  args:
    executable: /bin/bash
  become: true
  when: omp_current_version.rc != 0 or omp_version not in omp_current_version.stdout
  tags: [omp]
