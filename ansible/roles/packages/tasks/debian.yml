---

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ linux_packages }}"
    state: present
    update_cache: false
  become: true

- name: Set architecture-specific download suffixes
  ansible.builtin.set_fact:
    nvim_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"
    eza_arch: "{{ 'aarch64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"
    lazydocker_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"
    omp_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x64' }}"

- name: Install software-properties-common and python3-debian (for deb822_repository)
  ansible.builtin.apt:
    name:
      - software-properties-common
      - python3-debian
    state: present
  become: true
  tags: [python, python314]

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags: [python, python314]

- name: Download deadsnakes PPA GPG key
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776"
    dest: /etc/apt/keyrings/deadsnakes.asc
    mode: "0644"
  become: true
  when: ansible_facts['os_family'] == "Debian"
  changed_when: false
  tags: [python, python314]

- name: Add deadsnakes PPA for Python 3.14 (deb822 format)
  ansible.builtin.deb822_repository:
    name: deadsnakes-ppa
    types: [deb]
    uris: "https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu"
    suites: ["{{ ansible_facts['distribution_release'] if ansible_facts['distribution'] == 'Ubuntu' else 'jammy' }}"]
    components: [main]
    signed_by: /etc/apt/keyrings/deadsnakes.asc
    state: present
    enabled: yes
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags: [python, python314]

- name: Update apt cache after adding deadsnakes PPA
  ansible.builtin.apt:
    update_cache: yes
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags: [python, python314]

- name: Install Python 3.14 from deadsnakes PPA
  ansible.builtin.apt:
    name:
      - python3.14
      - python3.14-venv
      - python3.14-dev
    state: present
  become: true
  when: ansible_facts['os_family'] == "Debian"
  tags: [python, python314]

- name: Check if nvim is already installed and get version
  ansible.builtin.command: nvim --version
  register: nvim_current_version
  failed_when: false
  changed_when: false
  tags: [nvim, neovim]

- name: Get latest Neovim release tag from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/neovim/neovim/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github+json"
  register: nvim_release
  tags: [nvim, neovim]

- name: Download and install latest Neovim (tarball — AppImages need FUSE, which most VPS/containers lack)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL "https://github.com/neovim/neovim/releases/download/{{ nvim_release.json.tag_name }}/nvim-linux-{{ nvim_arch }}.tar.gz" -o /tmp/nvim.tar.gz
    tar -C /usr/local -xzf /tmp/nvim.tar.gz --strip-components=1
    rm -f /tmp/nvim.tar.gz
  args:
    executable: /bin/bash
  become: true
  when: nvim_current_version.rc != 0 or nvim_release.json.tag_name not in nvim_current_version.stdout
  tags: [nvim, neovim]

- name: Check if eza is already installed and get version
  ansible.builtin.command: eza --version
  register: eza_current_version
  failed_when: false
  changed_when: false
  tags: [eza]

- name: Get latest eza release tag from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/eza-community/eza/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github+json"
  register: eza_release
  tags: [eza]

- name: Set eza version fact
  ansible.builtin.set_fact:
    eza_version: "{{ eza_release.json.tag_name | regex_replace('^v', '') }}"
  tags: [eza]

- name: Download eza binary
  ansible.builtin.get_url:
    url: "https://github.com/eza-community/eza/releases/latest/download/eza_{{ eza_arch }}-unknown-linux-gnu.tar.gz"
    dest: /tmp/eza.tar.gz
    mode: "0644"
  become: true
  when: eza_current_version.rc != 0 or eza_version not in eza_current_version.stdout
  tags: [eza]

- name: Extract eza binary
  ansible.builtin.unarchive:
    src: /tmp/eza.tar.gz
    dest: /usr/local/bin/
    remote_src: true
    extra_opts: ["--strip-components=0"]
  become: true
  when: eza_current_version.rc != 0 or eza_version not in eza_current_version.stdout
  tags: [eza]

- name: Ensure eza is executable
  ansible.builtin.file:
    path: /usr/local/bin/eza
    mode: "0755"
    owner: root
    group: root
  become: true
  when: eza_current_version.rc != 0 or eza_version not in eza_current_version.stdout
  tags: [eza]

- name: Cleanup eza tarball
  ansible.builtin.file:
    path: /tmp/eza.tar.gz
    state: absent
  become: true
  when: eza_current_version.rc != 0 or eza_version not in eza_current_version.stdout
  tags: [eza]

- name: Check if lazydocker is already installed and get version
  ansible.builtin.command: lazydocker --version
  register: lazydocker_current_version
  failed_when: false
  changed_when: false
  tags: [lazydocker]

- name: Get latest lazydocker release tag from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/jesseduffield/lazydocker/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github+json"
  register: lazydocker_release
  tags: [lazydocker]

- name: Set lazydocker version fact
  ansible.builtin.set_fact:
    lazydocker_version: "{{ lazydocker_release.json.tag_name | regex_replace('^v', '') }}"
  tags: [lazydocker]

- name: Download lazydocker binary
  ansible.builtin.get_url:
    url: "https://github.com/jesseduffield/lazydocker/releases/latest/download/lazydocker_{{ lazydocker_version }}_Linux_{{ lazydocker_arch }}.tar.gz"
    dest: /tmp/lazydocker.tar.gz
    mode: "0644"
  become: true
  when: lazydocker_current_version.rc != 0 or lazydocker_version not in lazydocker_current_version.stdout
  tags: [lazydocker]

- name: Extract lazydocker binary
  ansible.builtin.unarchive:
    src: /tmp/lazydocker.tar.gz
    dest: /usr/local/bin/
    remote_src: true
    include:
      - lazydocker
  become: true
  when: lazydocker_current_version.rc != 0 or lazydocker_version not in lazydocker_current_version.stdout
  tags: [lazydocker]

- name: Ensure lazydocker is executable
  ansible.builtin.file:
    path: /usr/local/bin/lazydocker
    mode: "0755"
    owner: root
    group: root
  become: true
  when: lazydocker_current_version.rc != 0 or lazydocker_version not in lazydocker_current_version.stdout
  tags: [lazydocker]

- name: Cleanup lazydocker tarball
  ansible.builtin.file:
    path: /tmp/lazydocker.tar.gz
    state: absent
  become: true
  when: lazydocker_current_version.rc != 0 or lazydocker_version not in lazydocker_current_version.stdout
  tags: [lazydocker]

- name: Check if zoxide is already installed
  ansible.builtin.command: zoxide --version
  register: zoxide_check
  failed_when: false
  changed_when: false
  tags: [zoxide]

- name: Install zoxide via official installer script
  ansible.builtin.shell: |
    curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | bash
  args:
    creates: "{{ user_home }}/.local/bin/zoxide"
  environment:
    HOME: "{{ user_home }}"
  become: false
  when: zoxide_check.rc != 0
  tags: [zoxide]

- name: Check if starship is already installed
  ansible.builtin.command: starship --version
  register: starship_check
  failed_when: false
  changed_when: false
  tags: [starship]

- name: Install starship prompt via official installer
  ansible.builtin.shell: |
    curl -sSfL https://starship.rs/install.sh | sh -s -- --yes
  become: true
  when: starship_check.rc != 0
  tags: [starship]

- name: Check if ripgrep is already installed and get version
  ansible.builtin.command: rg --version
  register: rg_current_version
  failed_when: false
  changed_when: false
  tags: [ripgrep]

- name: Get latest ripgrep release tag from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/BurntSushi/ripgrep/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github+json"
  register: rg_release
  tags: [ripgrep]

- name: Set ripgrep version fact
  ansible.builtin.set_fact:
    rg_version: "{{ rg_release.json.tag_name | regex_replace('^v', '') }}"
  tags: [ripgrep]

- name: Download and install latest ripgrep
  ansible.builtin.shell: |
    set -euo pipefail
    tag="{{ rg_release.json.tag_name }}"
    asset="ripgrep-${tag}-{{ 'aarch64-unknown-linux-gnu' if ansible_facts['architecture'] == 'aarch64' else 'x86_64-unknown-linux-musl' }}"
    curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${tag}/${asset}.tar.gz" -o /tmp/ripgrep.tar.gz
    rm -rf /tmp/ripgrep-extract && mkdir -p /tmp/ripgrep-extract
    tar -xzf /tmp/ripgrep.tar.gz -C /tmp/ripgrep-extract --strip-components=1
    install -m 0755 /tmp/ripgrep-extract/rg /usr/local/bin/rg
    rm -rf /tmp/ripgrep.tar.gz /tmp/ripgrep-extract
  args:
    executable: /bin/bash
  become: true
  when: rg_current_version.rc != 0 or rg_version not in rg_current_version.stdout
  tags: [ripgrep]

